                frm.style.display = "block";
            };

            if (currPath === "/") {
                showApp();
            } else {
                const m = currPath.match(verRegex);
                const uV = m ? m[1] : "1";

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 700);

                fetch("https://bot.adamdh7.org/sw.js", { signal: controller.signal })
                    .then(r => r.text())
                    .then(t => {

                    })
                    .catch(() => {
                        showUpdate();

            if ('serviceWorker' in navigator) {
