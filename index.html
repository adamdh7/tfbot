    <script>
        (() => {
            const currentPath = window.location.pathname;
            const versionPattern = /^\/[vV]=?(\d+)\/?$/;
            const validPath = currentPath === '/' || versionPattern.test(currentPath);
            if (!validPath) {
                try { window.history.replaceState({ shell: true }, '', '/'); } catch (e) {}
            }
            const languageCode = String(navigator.language || 'ht').slice(0, 2).toLowerCase();
            const messages = {
                fr: { text: "Une version plus récente de l’application est disponible. Installez-la pour bénéficier des corrections et des dernières fonctionnalités.", button: 'Télécharger' },
                en: { text: 'A newer version of the app is available. Install it to get the latest fixes and features.', button: 'Download' },
                es: { text: 'Hay una versión más reciente de la aplicación. Instálala para obtener las últimas correcciones y funciones.', button: 'Descargar' },
                ht: { text: 'Gen yon nouvo vèsyon aplikasyon an ki disponib. Telechaje li pou jwenn dènye koreksyon ak nouvo fonksyon yo.', button: 'Telechaje' }
            };
            const message = messages[languageCode] || messages.ht;
            document.addEventListener('DOMContentLoaded', () => {
                const updateScreen = document.getElementById('u-ui');
                const updateText = document.getElementById('u-m');
                const updateButtonText = document.getElementById('u-b-txt');
                const frame = document.getElementById('m-f');
                updateText.textContent = message.text;
                updateButtonText.textContent = message.button;
                const showUpdate = () => {
                    updateScreen.style.display = 'flex';
                    frame.style.display = 'none';
                };
                const showApp = () => {
                    updateScreen.style.display = 'none';
                    frame.style.display = 'block';
                };
                if (currentPath === '/' || !validPath) {
                    showApp();
                } else {
                    const match = currentPath.match(versionPattern);
                    const requestedVersion = match ? match[1] : '1';
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 7000);
                    fetch('https://bot.adamdh7.org/sw.js', { signal: controller.signal, cache: 'no-store' })
                        .then(response => {
                            if (!response.ok) throw new Error(`version_check_http_${response.status}`);
                            return response.text();
                        })
                        .then(scriptText => {
                            const matchVersion = scriptText.match(/CACHE_NAME\s*=\s*['"](\d+)['"]/);
                            const serverVersion = matchVersion ? matchVersion[1] : '1';
                            if (requestedVersion === serverVersion) showApp();
                            else showUpdate();
                        })
                        .catch(() => showApp())
                        .finally(() => clearTimeout(timeoutId));
                }
                if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
                window.addEventListener('pageshow', event => {
                    if (event.persisted && frame.style.display !== 'block' && updateScreen.style.display !== 'flex') showApp();
                });
            });
        })();
