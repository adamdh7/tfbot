<script>
(function(){
    const currPath=window.location.pathname;
    const versionMatch=currPath.match(/^\/[vV]=?(\d+)\/?$/);
    if(currPath!== '/' && !versionMatch){window.location.replace('/');return;}
    const supported=['ht','fr','en','es'];
    let lang='ht';
    try{const saved=localStorage.getItem('tfbot:lang')||localStorage.getItem('lang');if(supported.includes(saved))lang=saved;else{const browser=String(navigator.language||'ht').slice(0,2).toLowerCase();if(supported.includes(browser))lang=browser;}}catch(error){const browser=String(navigator.language||'ht').slice(0,2).toLowerCase();if(supported.includes(browser))lang=browser;}
    const tx={
        fr:{m:"Une version plus récente de tfbot est disponible. Pour bénéficier des dernières améliorations et assurer la compatibilité de votre session, veuillez installer la version actuelle depuis notre site officiel.",b:"Télécharger"},
        en:{m:"A newer version of tfbot is available. To get the latest improvements and maintain session compatibility, install the current version from our official website.",b:"Download"},
        es:{m:"Hay una versión más reciente de tfbot. Para obtener las últimas mejoras y mantener la compatibilidad de la sesión, instala la versión actual desde nuestro sitio oficial.",b:"Descargar"},
        ht:{m:"Gen yon nouvo vèsyon tfbot ki disponib. Pou jwenn dènye amelyorasyon yo epi kenbe sesyon ou mache byen, tanpri enstale vèsyon aktyèl la sou sit ofisyèl nou an.",b:"Telechaje"}
    };
    document.addEventListener('DOMContentLoaded',async()=>{
        const ui=document.getElementById('u-ui');
        const msg=document.getElementById('u-m');
        const btn=document.getElementById('u-b-txt');
        const frame=document.getElementById('m-f');
        msg.textContent=tx[lang].m;
        btn.textContent=tx[lang].b;
        const showUpdate=()=>{ui.style.display='flex';frame.style.display='none';};
        const showApp=()=>{ui.style.display='none';frame.style.display='block';};
        if(currPath==='/'){
            showApp();
        }else{
            const requested=versionMatch?versionMatch[1]:'1';
            const controller=new AbortController();
            const timeoutId=setTimeout(()=>controller.abort(),7000);
            try{
                const response=await fetch('https://bot.adamdh7.org/sw.js',{signal:controller.signal,cache:'no-store',credentials:'omit'});
                if(!response.ok)throw new Error('service_worker_check_failed');
                const source=await response.text();
                const match=source.match(/CACHE_NAME[^\n]*?(?:['"])?(\d+)(?:['"])?/i);
                const current=match?match[1]:'1';
                clearTimeout(timeoutId);
                if(requested===current)showApp();else showUpdate();
            }catch(error){clearTimeout(timeoutId);showUpdate();}
        }
        try{
            if('serviceWorker' in navigator){
                const existing=await navigator.serviceWorker.getRegistration('/');
                if(!existing)await navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'});
            }
        }catch(error){}
    });
})();
</script>
