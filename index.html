<!DOCTYPE html>
<html lang="ht" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bot (tfbot)</title>
    <meta name="description" content="Bot (tfbot) est un service web qui permet aux utilisateurs de ce connecter et de déployer Bot (tfbot).">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="theme-color" content="#000000">
    <link rel="canonical" href="https://bot.adamdh7.org/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bot.adamdh7.org/">
    <meta property="og:title" content="Bot (tfbot)">
    <meta property="og:description" content="Bot (tfbot) est un service web qui permet aux utilisateurs de ce connecter et de déployer Bot (tfbot).">
    <meta property="og:image" content="https://adamdh7.org/asset/nwa.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://bot.adamdh7.org/">
    <meta name="twitter:title" content="Bot (tfbot)">
    <meta name="twitter:description" content="Bot (tfbot) est un service web qui permet aux utilisateurs de ce connecter et de déployer Bot (tfbot).">
    <meta name="twitter:image" content="https://adamdh7.org/asset/nwa.png">
    <link rel="icon" href="https://adamdh7.org/asset/nwa.png" type="image/png">
    <link rel="apple-touch-icon" href="https://adamdh7.org/asset/nwa.png">
    <link rel="preload" as="image" href="https://adamdh7.org/asset/nwa.png">
    <link rel="manifest" href="/manifest.json">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100%;
            overflow: hidden;
            background: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior: none;
            scrollbar-width: none;
        }
        html::-webkit-scrollbar, body::-webkit-scrollbar {
            display: none;
        }
        #m-f {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            border: 0;
            display: block;
            background: #000000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease;
        }
        #m-f.ready {
            opacity: 1;
            pointer-events: auto;
        }
        #frame-loading {
            position: fixed;
            inset: 0;
            z-index: 9000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            opacity: 1;
            visibility: visible;
            transition: opacity .18s ease, visibility .18s ease;
        }
        #frame-loading.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #frame-loading img {
            display: block;
            width: clamp(76px, 22vw, 112px);
            height: clamp(76px, 22vw, 112px);
            object-fit: contain;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
            pointer-events: none;
        }
    </style>
    <script>
        try { window.history.scrollRestoration = 'manual'; } catch (error) {}
        document.addEventListener('dblclick', function(event) { event.preventDefault(); });
        document.addEventListener('contextmenu', function(event) { event.preventDefault(); });

        const verRegex = /^\/[vV]=?(\d+)\/?$/;
        if (window.location.pathname !== '/' && verRegex.test(window.location.pathname)) {
            try { window.history.replaceState({ view: 'home' }, '', '/'); } catch (error) {}
        } else if (window.location.pathname !== '/') {
            try { window.history.replaceState({ view: 'home' }, '', '/'); } catch (error) {}
        }

        const coordinatorResolveUrl = 'https://tfbot7.onrender.com/__tfbot/router/resolve';
        const allowedAppOrigins = [
            'https://tf.bot.adamdh7.org',
            'https://tfbot2.onrender.com',
            'https://tfbot3.onrender.com',
            'https://tfbot4.onrender.com',
            'https://tfbot5.onrender.com',
            'https://tfbot6.onrender.com'
        ];

        function normalizeAllowedOrigin(value) {
            try {
                const parsed = new URL(String(value || ''));
                const origin = parsed.origin.replace(/\/+$/, '');
                return allowedAppOrigins.includes(origin) ? origin : '';
            } catch (error) {
                return '';
            }
        }

        async function resolveActiveOrigin() {
            const controller = new AbortController();
            const timeoutId = setTimeout(function() { controller.abort(); }, 5000);
            try {
                const response = await fetch(coordinatorResolveUrl, {
                    method: 'GET',
                    cache: 'no-store',
                    mode: 'cors',
                    credentials: 'omit',
                    redirect: 'follow',
                    headers: { 'Accept': 'application/json' },
                    signal: controller.signal
                });
                const payload = await response.json().catch(function() { return null; });
                if (!response.ok) {
                    const failure = new Error(String(payload?.error || 'coordinator_unavailable'));
                    failure.retryAfterMs = Number(payload?.retryAfterMs || 5000);
                    throw failure;
                }
                const origin = normalizeAllowedOrigin(payload && (payload.activeUrl || payload.url));
                if (payload?.ok === true && origin && payload.workerActive === true && payload.workerState === 'active') return origin;
                const waiting = new Error('active_worker_not_ready');
                waiting.retryAfterMs = Number(payload?.retryAfterMs || 2500);
                throw waiting;
            } finally {
                clearTimeout(timeoutId);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const frame = document.getElementById('m-f');
            const splash = document.getElementById('frame-loading');
            let activeOrigin = '';
            let frameLoaded = false;
            let activeOriginConfirmed = false;
            let resolving = false;
            let retryTimer = null;
            let loadTimer = null;
            let monitorTimer = null;

            const showSplash = function() {
                splash.classList.remove('hidden');
                frame.classList.remove('ready');
            };

            const revealFrame = function() {
                if (!frameLoaded || !activeOriginConfirmed) return;
                if (loadTimer) clearTimeout(loadTimer);
                splash.classList.add('hidden');
                frame.classList.add('ready');
            };

            const startFrameLoad = function(origin) {
                activeOrigin = origin;
                frameLoaded = false;
                activeOriginConfirmed = false;
                showSplash();
                frame.classList.remove('ready');
                frame.src = origin + '/';
                if (loadTimer) clearTimeout(loadTimer);
                loadTimer = setTimeout(function() {
                    if (!frameLoaded) {
                        frame.removeAttribute('src');
                        showSplash();
                        scheduleResolve(1200);
                    }
                }, 20000);
            };

            const applyCoordinatorSelection = function(origin) {
                if (!origin) return;
                if (origin !== activeOrigin || !frame.hasAttribute('src')) startFrameLoad(origin);
                activeOriginConfirmed = true;
                revealFrame();
            };

            function scheduleResolve(delay) {
                if (retryTimer) clearTimeout(retryTimer);
                retryTimer = setTimeout(function() { void resolveAndApply(); }, Math.max(250, Number(delay) || 1200));
            }

            const resolveAndApply = async function() {
                if (resolving) return;
                resolving = true;
                try {
                    const selectedOrigin = await resolveActiveOrigin();
                    applyCoordinatorSelection(selectedOrigin);
                } catch (error) {
                    if (!frameLoaded || !activeOriginConfirmed) showSplash();
                    scheduleResolve(error?.retryAfterMs || 2500);
                } finally {
                    resolving = false;
                }
            };

            frame.addEventListener('load', function() {
                if (!activeOrigin || !frame.hasAttribute('src')) return;
                frameLoaded = true;
                revealFrame();
            });

            frame.addEventListener('error', function() {
                frameLoaded = false;
                activeOriginConfirmed = false;
                showSplash();
                scheduleResolve(1000);
            });

            monitorTimer = setInterval(function() {
                void resolveAndApply();
            }, 77000);

            showSplash();
            frame.removeAttribute('src');
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(function() {});
            void resolveAndApply();
        });
    </script>
</head>
<body>
    <div id="frame-loading" aria-hidden="true"><img src="https://adamdh7.org/asset/nwa.png" alt="" draggable="false"></div>
    <iframe id="m-f" title="Bot (tfbot)" allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture; storage-access-by-user-activation" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</body>
</html>
