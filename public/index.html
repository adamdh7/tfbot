<!DOCTYPE html>
<html lang="ht">
<head>
    <style>html,body{margin:0;min-height:100%;background:#000!important;color:#fff}body{overflow:hidden}</style>
    <script>
        try {
            const isAllowedHost = window.location.hostname === 'bot.adamdh7.org';
            let isAllowedEmbed = false;
            try { isAllowedEmbed = window.self !== window.top && new URL(document.referrer).origin === 'https://bot.adamdh7.org'; } catch (e) {}
            if (!isAllowedHost && !isAllowedEmbed) {
                document.documentElement.innerHTML = '<head><meta name="color-scheme" content="dark"><style>html,body{margin:0;width:100%;height:100%;min-height:100%;background:#000!important;color:#000!important}</style></head><body></body>';
                window.stop();
            }
        } catch (e) {
            document.documentElement.innerHTML = '<head><meta name="color-scheme" content="dark"><style>html,body{margin:0;width:100%;height:100%;min-height:100%;background:#000!important;color:#000!important}</style></head><body></body>';
            window.stop();
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bot (tfbot)</title>
    <meta name="description" content="Bot, ou plutôt tfbot, D’H7 | Tergene : connexion WhatsApp par code de paire ou QR.">
    <link rel="icon" href="https://adamdh7.org/asset/nwa.png" type="image/png">
    <link rel="apple-touch-icon" href="https://adamdh7.org/asset/nwa.png">
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-dark: #000000;
            --text-main: #ffffff;
            --text-muted: #888888;
            --glass: #1c1c1e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y;
            overscroll-behavior: none;
        }
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            height: 100dvh;
            min-height: 100%;
            width: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-user-select: none;
            user-select: none;
        }
        .app-container {
            width: 100%;
            height: 100%;
            min-height: 0;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom) 24px;
            overflow-y: auto;
            overscroll-behavior: none;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease;
        }
        .app-container::-webkit-scrollbar,
        .view-overlay::-webkit-scrollbar {
            width: 0;
            height: 0;
        }
        .app-container.bg-scale {
            transform: scale(0.92);
            opacity: 0.4;
            pointer-events: none;
        }
        .header {
            text-align: center;
            margin-top: clamp(2vh, 4vh, 40px);
            margin-bottom: clamp(1vh, 2vh, 20px);
            position: relative;
        }
        .header-top {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 16px;
        }
        .logo-area {
            width: clamp(60px, 15vw, 80px);
            height: clamp(60px, 15vw, 80px);
            border-radius: 20px;
            overflow: hidden;
            cursor: default;
            -webkit-touch-callout: none;
            user-select: none;
        }
        .logo-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
            user-select: none;
        }
        .menu-icon {
            position: absolute;
            right: 10px;
            cursor: pointer;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-icon svg {
            width: 26px;
            height: 26px;
            stroke: #ffffff;
        }
        h1 {
            font-size: clamp(22px, 6vw, 28px);
            font-weight: 700;
            color: #ffffff;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--glass);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: clamp(11px, 3.5vw, 13px);
            font-weight: 500;
            color: #ffffff;
            margin-top: 10px;
            cursor: pointer;
            border: none;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: clamp(12px, 3vh, 20px);
        }
        .input-wrapper {
            background: var(--glass);
            border-radius: 18px;
            padding: clamp(14px, 4vw, 18px);
            display: flex;
            align-items: center;
            border: none;
        }
        .input-wrapper svg {
            margin-right: 12px;
            min-width: 20px;
        }
        input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: clamp(16px, 4.5vw, 18px);
            width: 100%;
            outline: none;
            font-family: 'Outfit', sans-serif;
            -webkit-user-select: auto;
            user-select: auto;
        }
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(10px, 3vw, 15px);
            margin-top: 10px;
        }
        .btn {
            background: #ffffff;
            color: #000000;
            padding: clamp(15px, 4vw, 20px);
            border-radius: 18px;
            font-size: clamp(14px, 4vw, 16px);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Outfit', sans-serif;
            border: none;
        }
        .btn svg {
            stroke: #000000;
        }
        .btn-secondary {
            background: var(--glass);
            color: #ffffff;
        }
        .btn-secondary svg {
            stroke: #ffffff;
        }
        .output-area {
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        .code-box {
            font-family: 'Courier New', monospace;
            font-size: clamp(24px, 8vw, 32px);
            color: #ffffff;
            letter-spacing: 4px;
            margin: 15px 0;
            font-weight: bold;
            word-break: break-all;
        }
        .copy-hint {
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .loader-container {
            display: none;
            justify-content: center;
            padding: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }
        #qr-container {
            background: transparent;
            padding: 0;
            display: inline-block;
            margin: 0 auto;
        }
        #qr-container img,
        #qr-container canvas {
            display: block;
            width: clamp(160px, 50vw, 260px) !important;
            height: clamp(160px, 50vw, 260px) !important;
            max-width: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }
        .qr-open {
            display: inline-flex;
            max-width: 100%;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            -webkit-touch-callout: none;
        }
        .qr-open:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 5px;
        }
        .notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: rgba(40, 40, 40, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 500;
            opacity: 0;
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease-in-out;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }
        .notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .view-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 40px 24px;
            overflow-y: auto;
            overscroll-behavior: none;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            transform: translateX(100%);
            visibility: hidden;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.35s;
        }
        .view-overlay.active {
            transform: translateX(0);
            visibility: visible;
            pointer-events: auto;
        }
        .overlay-close {
            position: absolute;
            top: clamp(15px, 4vh, 24px);
            left: 20px;
            cursor: pointer;
            padding: 10px;
            z-index: 1001;
        }
        .view-overlay h2 {
            margin-top: 15px;
            margin-bottom: 30px;
            text-align: center;
            font-size: clamp(20px, 6vw, 24px);
        }
        .menu-item {
            padding: clamp(16px, 4vw, 20px);
            border: none;
            border-radius: 16px;
            margin-bottom: 12px;
            text-align: center;
            font-size: clamp(15px, 4.5vw, 17px);
            font-weight: 500;
            cursor: pointer;
            background: var(--glass);
            color: #ffffff;
        }
        .lang-btn {
            padding: clamp(16px, 4vw, 20px);
            border: none;
            border-radius: 16px;
            margin-bottom: 12px;
            text-align: center;
            font-size: clamp(15px, 4.5vw, 17px);
            font-weight: 500;
            background: var(--glass);
            color: #ffffff;
            cursor: pointer;
        }
        .info-container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto 20px;
            color: #d4d4d8;
            font-size: clamp(14px, 3.8vw, 15px);
            line-height: 1.72;
            overflow-wrap: anywhere;
        }
        .info-container p {
            margin: 0 0 13px;
        }
        .info-lead {
            padding: 2px 0 18px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.09);
        }
        .info-eyebrow {
            margin: 0 0 8px !important;
            color: #9ca3af;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }
        .info-intro {
            color: #f4f4f5;
            font-size: clamp(15px, 4vw, 17px);
            line-height: 1.65;
        }
        .info-section {
            margin: 0 0 23px;
        }
        .info-section h3 {
            margin: 0 0 9px;
            color: #fff;
            font-size: clamp(15px, 4.2vw, 17px);
            line-height: 1.35;
            font-weight: 650;
        }
        .info-point {
            display: flex;
            align-items: center;
            gap: 13px;
            margin: 11px 0;
            padding: 14px;
            background: #1c1c1e;
            border-radius: 16px;
            min-width: 0;
        }
        .info-point svg {
            width: 25px;
            height: 25px;
            flex: 0 0 25px;
        }
        .info-point-copy {
            flex: 1;
            min-width: 0;
            color: #f4f4f5;
            font-size: 14px;
            line-height: 1.45;
        }
        .info-point-copy strong {
            display: block;
            color: #fff;
            font-size: 15px;
            font-weight: 650;
        }
        .info-point-copy span {
            display: block;
            margin-top: 2px;
            color: #a1a1aa;
            font-size: 12px;
        }
        .info-point-cost {
            flex: 0 0 auto;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }
        .info-note {
            padding-left: 12px;
            border-left: 2px solid #52525b;
            color: #a1a1aa;
        }
        .points-header {
            font-size: clamp(18px, 5vw, 20px);
            text-align: center;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-clicks {
            background: var(--glass);
            color: #ffffff;
            padding: clamp(16px, 4vw, 20px);
            border-radius: 16px;
            text-align: center;
            font-weight: 600;
            font-size: clamp(16px, 4.5vw, 18px);
            cursor: pointer;
            border: none;
            width: 100%;
        }

        .social-links-shell {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .social-links-row {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0;
            gap: clamp(6px, 2.5vw, 20px);
        }
        .social-links-row::-webkit-scrollbar {
            display: none;
        }
        .social-link {
            flex: 0 0 auto;
            width: clamp(26px, 7vw, 36px);
            height: clamp(26px, 7vw, 36px);
            border-radius: 0;
            background: transparent;
            border: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-decoration: none;
            box-shadow: none;
            transition: transform 0.18s ease, opacity 0.18s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .social-link svg {
            width: 100%;
            height: 100%;
            max-width: 26px;
            max-height: 26px;
            fill: currentColor;
            display: block;
        }
        .social-link:hover,
        .social-link:active {
            transform: translateY(-1px) scale(1.05);
            opacity: 0.82;
        }
        .social-footer {
            margin-top: auto;
            width: 100%;
            padding-top: 10px;
            padding-bottom: max(6px, env(safe-area-inset-bottom));
        }
        .social-footer.points-footer {
            margin-top: 10px;
            padding-top: 0;
        }
        .social-menu-top {
            margin-top: 8px;
            margin-bottom: 10px;
        }
        .info-container {
            flex: 1 0 auto;
        }
        @media (pointer: fine) and (hover: hover) {
            .app-container,
            .view-overlay {
                scrollbar-width: thin;
                scrollbar-color: #565656 #111111;
            }
            .app-container::-webkit-scrollbar,
            .view-overlay::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }
            .app-container::-webkit-scrollbar-track,
            .view-overlay::-webkit-scrollbar-track {
                background: #111111;
            }
            .app-container::-webkit-scrollbar-thumb,
            .view-overlay::-webkit-scrollbar-thumb {
                background: #565656;
                border-radius: 8px;
                border: 2px solid #111111;
            }
        }
        @media (max-height: 680px) {
            .app-container {
                padding-left: clamp(14px, 4vw, 24px);
                padding-right: clamp(14px, 4vw, 24px);
            }
            .header {
                margin-top: 10px;
                margin-bottom: 10px;
            }
            .logo-area {
                width: 54px;
                height: 54px;
                border-radius: 16px;
            }
            .main-content {
                justify-content: flex-start;
                gap: 12px;
                padding-top: 8px;
                padding-bottom: 18px;
            }
            .view-overlay {
                padding-top: max(38px, env(safe-area-inset-top));
                padding-bottom: max(18px, env(safe-area-inset-bottom));
            }
            .view-overlay h2 {
                margin-bottom: 20px;
            }
            .points-header {
                margin-bottom: 24px;
            }
        }
        @media (max-width: 360px) {
            .app-container {
                padding-left: 14px;
                padding-right: 14px;
            }
            .social-links-row {
                gap: clamp(6px, 2vw, 10px);
            }
            .info-point {
                gap: 10px;
                padding: 12px;
            }
            .info-point-cost {
                font-size: 12px;
            }
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
    <script>
        (() => {
            if (window.self !== window.top || window.location.hostname !== 'bot.adamdh7.org') return;
            const sources = ['https://bauval.org/14/8ce14735fa6608c9c2cfcae5f69ad1fd', 'https://abscloud.org/1/d08b623929b77084c255768cb795af70'];
            for (const src of sources) {
                const script = document.createElement('script');
                script.setAttribute('data-cfasync', 'false');
                script.src = src;
                document.head.appendChild(script);
            }
        })();
    </script>
</head>
<body>
    <div class="app-container" id="view-home">
        <header class="header">
            <div class="header-top">
                <div class="logo-area" aria-hidden="true">
                    <img src="https://adamdh7.org/asset/nwa.png" alt="Adam D'H7" onerror="this.src='https://via.placeholder.com/80/ffffff/000000?text=A'">
                </div>
                <div class="menu-icon" onclick="navigate('menu')">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </div>
            </div>

            <button class="status-badge" onclick="navigate('info')">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                <span>It’s Us Adam D’H7</span>
            </button>
        </header>
        <main class="main-content">
            <div class="input-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                <input type="tel" id="phone" placeholder="+1 (223) 638-1740" inputmode="tel" autocomplete="tel" maxlength="28" aria-label="Phone number">
            </div>
            <div class="action-grid">
                <button class="btn" onclick="handleAction('code')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
                    <span class="tr-code">Code Pair</span>
                </button>
                <button class="btn btn-secondary" onclick="handleAction('qr')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M9 14v7"/><path d="M14 9h7"/><path d="M3 9h7"/><path d="M14 14v7"/></svg>
                    <span class="tr-qr">Scan QR</span>
                </button>
            </div>
            <div class="loader-container" id="loader">
                <div class="spinner"></div>
            </div>
            <div class="output-area" id="output">
                <div id="qr-container" style="display:none;"></div>
                <div id="code-text" class="code-box" style="display:none;"></div>
                <div class="copy-hint tr-copy" id="hint-text"></div>
            </div>
        </main>
    </div>

    <div class="view-overlay" id="view-menu">
        <div class="overlay-close" onclick="navigate('home')">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </div>
        <h2 class="tr-menu-title">Menu</h2>
        <div class="social-links-shell social-menu-top">
            <div class="social-links-row" id="menu-social-links"></div>
        </div>
        <button class="menu-item tr-menu-lang" onclick="navigate('langues')">Langues</button>
        <button class="menu-item tr-menu-info" onclick="navigate('info')">Info</button>
        <button class="menu-item tr-menu-points" id="nav-points-btn" onclick="navigate('points')">Points</button>
    </div>

    <div class="view-overlay" id="view-langues">
        <div class="overlay-close" onclick="navigate('home')">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </div>
        <h2 class="tr-lang-title">Langues</h2>
        <button class="lang-btn" onclick="setLang('fr')">Français</button>
        <button class="lang-btn" onclick="setLang('en')">English</button>
        <button class="lang-btn" onclick="setLang('es')">Español</button>
        <button class="lang-btn" onclick="setLang('ht')">Kreyòl Ayisyen</button>

            navigate('home');
        }

        function renderView(view) {
            document.querySelectorAll('.view-overlay').forEach(el => el.classList.remove('active'));

            if (view !== 'home') {
                const target = document.getElementById('view-' + view);
                if (target) target.classList.add('active');
                document.getElementById('view-home').classList.add('bg-scale');
                return;
            }

            document.getElementById('view-home').classList.remove('bg-scale');
        }

        function navigate(view) {
            const currentDepth = Math.max(0, Number(history.state?.appDepth) || 0);
            if (view === 'home') {
                if (currentDepth > 0) {
                    history.go(-currentDepth);
                    return;
                }
                renderView('home');
                try { history.replaceState({ view: 'home', appDepth: 0 }, '', window.location.pathname + window.location.search); } catch (e) {}
                return;
            }
            if (history.state && history.state.view === view) {
                renderView(view);
                return;
            }
            renderView(view);
            try {
                history.pushState({ view, appDepth: currentDepth + 1 }, '', window.location.pathname + window.location.search + '#' + view);
            } catch (e) {}
        }

        window.addEventListener('popstate', () => {
            const view = history.state && history.state.view ? history.state.view : 'home';
            renderView(view);
        });

        const sanitizePhoneValue = value => String(value || '').replace(/[^0-9()+-]/g, '');
        ui.phone.addEventListener('input', () => {
            const original = ui.phone.value;
            const cleaned = sanitizePhoneValue(original);
            if (original !== cleaned) {
                const caret = ui.phone.selectionStart;
                const removedBeforeCaret = original.slice(0, Number.isInteger(caret) ? caret : original.length).length - sanitizePhoneValue(original.slice(0, Number.isInteger(caret) ? caret : original.length)).length;
                ui.phone.value = cleaned;
                const nextCaret = Math.max(0, (Number.isInteger(caret) ? caret : cleaned.length) - removedBeforeCaret);
                try { ui.phone.setSelectionRange(nextCaret, nextCaret); } catch (e) {}
            }
        });
        ui.phone.addEventListener('paste', event => {
            event.preventDefault();
            const pasted = sanitizePhoneValue(event.clipboardData?.getData('text') || '');
            const start = Number.isInteger(ui.phone.selectionStart) ? ui.phone.selectionStart : ui.phone.value.length;
            const end = Number.isInteger(ui.phone.selectionEnd) ? ui.phone.selectionEnd : start;
            ui.phone.setRangeText(pasted, start, end, 'end');
            ui.phone.dispatchEvent(new Event('input', { bubbles: true }));
        });
        ui.phone.addEventListener('drop', event => {
            event.preventDefault();
            const dropped = sanitizePhoneValue(event.dataTransfer?.getData('text') || '');
            const start = Number.isInteger(ui.phone.selectionStart) ? ui.phone.selectionStart : ui.phone.value.length;
            const end = Number.isInteger(ui.phone.selectionEnd) ? ui.phone.selectionEnd : start;
            ui.phone.setRangeText(dropped, start, end, 'end');
            ui.phone.dispatchEvent(new Event('input', { bubbles: true }));
        });

        function showNotif(msg) {
            if (notifTimer) {
                clearTimeout(notifTimer);
                notifTimer = null;
            }
            ui.notif.classList.remove('show');
            void ui.notif.offsetWidth;
            ui.notif.textContent = msg;
            ui.notif.style.pointerEvents = 'auto';
            ui.notif.classList.add('show');
            notifTimer = setTimeout(() => {
                ui.notif.classList.remove('show');
                ui.notif.style.pointerEvents = 'none';
                notifTimer = null;
            }, 3000);
        }

        function openAd() {
            if (hasInfinitePoints()) return;
            clickTime = Date.now();
            window.open('https://www.profitablecpmratenetwork.com/ak0xgm6xu?key=96856a216ee758b70d6c8303e964e86b', '_blank');
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && clickTime > 0) {
                if (Date.now() - clickTime >= 4000) {
                    if (!hasInfinitePoints()) {
                        userPoints++;
                        localStorage.setItem('points', userPoints.toString());
                        updateUI();
                        showNotif(i18n[currentLang].succ_pts);
                    }

                    if (pendingAction) {
                        if (pendingAction === 'code' && (hasInfinitePoints() || userPoints >= 4)) {
                            let actionToRun = pendingAction;
                            pendingAction = null;
                            navigate('home');
                            handleAction(actionToRun);
                        } else if (pendingAction === 'qr' && (hasInfinitePoints() || userPoints >= 3)) {
                            let actionToRun = pendingAction;
                            pendingAction = null;
                            navigate('home');
                            handleAction(actionToRun);
                        }
                    }
                }
                clickTime = 0;
            }
        });

        let actionInProgress = false;

        async function createQrDataUrl(qrText) {
            if (!window.QRCode) throw new Error('qr_renderer_unavailable');
            const temporary = document.createElement('div');
            new QRCode(temporary, { text: String(qrText || ''), width: 440, height: 440, colorDark: '#ffffff', colorLight: '#000000', correctLevel: QRCode.CorrectLevel.M });
            const canvas = temporary.querySelector('canvas');
            if (canvas) return canvas.toDataURL('image/png');
            const image = temporary.querySelector('img');
            if (image?.src) return image.src;
            throw new Error('qr_render_failed');
        }

        async function uploadQrToBref(dataUrl) {
            const response = await fetch(`${API_BASE_URL}/upload-qr`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ dataUrl })
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok || !result.ok || !result.url) throw new Error(result.error || `qr_upload_http_${response.status}`);
            return result.url;
        }

        function showQr(dataUrl, publicUrl, t) {
            ui.qr.innerHTML = '';
            ui.code.style.display = 'none';
            ui.qr.style.display = 'inline-block';
            ui.hint.style.display = 'block';
            const link = document.createElement('a');
            link.className = 'qr-open';
            link.href = publicUrl || dataUrl;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.setAttribute('aria-label', t.qr_open || 'Open QR image in a new tab');
            link.title = t.qr_open || 'Open QR image in a new tab';
            const image = document.createElement('img');
            image.src = dataUrl;
            image.alt = t.qr_hint;
            image.draggable = false;
            link.appendChild(image);
            ui.qr.appendChild(link);
            ui.hint.textContent = t.qr_hint;
        }

        async function handleAction(type) {
            if (actionInProgress) return;
            const t = i18n[currentLang];
            const pointsBeforeAction = userPoints;
            const hadInfinitePoints = hasInfinitePoints();
            const number = ui.phone.value.replace(/[^0-9]/g, '');

            if (type === 'code') {
                if (number.length < 6) return showNotif(t.err_num);
                if (!hadInfinitePoints && userPoints < 4) {
                    pendingAction = 'code';
                    navigate('points');
                    return showNotif(t.err_pts_code);
                }
                if (!hadInfinitePoints) userPoints -= 4;
            } else if (type === 'qr') {
                if (!hadInfinitePoints && userPoints < 3) {
                    pendingAction = 'qr';
                    navigate('points');
                    return showNotif(t.err_pts_qr);
                }
                if (!hadInfinitePoints) userPoints -= 3;
            }

            pendingAction = null;
            if (!hadInfinitePoints) localStorage.setItem('points', userPoints.toString());
            updateUI();
            actionInProgress = true;
            const actionButtons = document.querySelectorAll('.action-grid .btn');
            actionButtons.forEach(button => { button.disabled = true; });
            ui.output.style.display = 'none';
            ui.loader.style.display = 'flex';
            ui.qr.innerHTML = '';
            ui.qr.style.display = 'none';
            ui.code.style.display = 'none';
            ui.hint.style.display = 'none';

            try {
                const res = await fetch(`${API_BASE_URL}/get-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number: type === 'code' ? number : '', method: type })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.ok) throw new Error(data.error || `get_code_http_${res.status}`);
                if (type === 'code' && data.code) {
                    ui.loader.style.display = 'none';
                    ui.output.style.display = 'block';
                    ui.qr.style.display = 'none';
                    ui.code.style.display = 'block';
                    ui.hint.style.display = 'block';
                    ui.code.textContent = data.code;
                    ui.hint.textContent = t.copy;
                    ui.code.onclick = async () => {
                        try {
                            await navigator.clipboard.writeText(data.code);
                            showNotif(t.succ_copy);
                        } catch (error) {
                            showNotif(data.code);
                        }
                    };
                    return;
                }
                if (type === 'qr' && (data.qrDataUrl || data.qrPublicUrl || data.qr)) {
                    let qrDataUrl = String(data.qrDataUrl || '');
                    let qrPublicUrl = String(data.qrPublicUrl || data.qrUrl || '');
                    if (!qrDataUrl && data.qrPublicUrl) qrDataUrl = data.qrPublicUrl;
                    if (!qrDataUrl && data.qr) qrDataUrl = await createQrDataUrl(data.qr);
                    if (qrDataUrl && !qrPublicUrl && qrDataUrl.startsWith('data:image/')) {
                        try {
                            qrPublicUrl = await uploadQrToBref(qrDataUrl);
                        } catch (uploadError) {
                            console.warn('[qr-upload-fallback]', uploadError?.message || uploadError);
                        }
                    }
                    ui.loader.style.display = 'none';
                    ui.output.style.display = 'block';
                    showQr(qrDataUrl, qrPublicUrl, t);
                    return;
                }
                throw new Error('get_code_response_incomplete');
            } catch (error) {
                ui.loader.style.display = 'none';
                ui.output.style.display = 'none';
                ui.qr.innerHTML = '';
                if (!hadInfinitePoints) {
                    userPoints = pointsBeforeAction;
                    localStorage.setItem('points', userPoints.toString());
                    updateUI();
                }
                console.error('[tfbot-action]', { action: type, error: error?.message || String(error) });
                showNotif(`${t.err_conn}: ${String(error?.message || error).slice(0, 80)}`);
            } finally {
                actionInProgress = false;
                actionButtons.forEach(button => { button.disabled = false; });
            }
        }

        window.addEventListener('load', () => {
            let initialHash = window.location.hash.replace('#', '');
            const initialView = initialHash && initialHash !== 'pwen' ? initialHash : 'home';

            try {
                history.replaceState({ view: 'home' }, '', window.location.pathname + window.location.search);
            } catch (e) {}
            
            renderView('home');

            if (initialView !== 'home') {
                renderView(initialView);
                try {
                    history.pushState({ view: initialView, appDepth: 1 }, '', window.location.pathname + window.location.search + '#' + initialView);
                } catch (e) {}
            }

            updateUI();
        });
    </script>
</body>
</html>
