        const arrowIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;
        const infinityIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 8.5c-1.8 0-3.3 1.4-4.7 3.1l-.8.9-.8-.9C11.1 9.9 9.6 8.5 7.8 8.5 5.6 8.5 4 10.2 4 12s1.6 3.5 3.8 3.5c1.8 0 3.3-1.4 4.7-3.1l.8-.9.8.9c1.4 1.7 2.9 3.1 4.7 3.1 2.2 0 3.8-1.6 3.8-3.5s-1.6-3.5-3.8-3.5Z"/></svg>`;
        const isUnlimitedMode = window.location.pathname === '/ok' || window.location.pathname.indexOf('/ok/') === 0;
        let currentOutputType = '';
        let notifTimer = null;

        let currentLang = localStorage.getItem('lang');
        if (!currentLang) {
            const navL = navigator.language.slice(0, 2);
            currentLang = ['fr', 'en', 'es', 'ht'].includes(navL) ? navL : 'ht';
        }
        let userPoints = isUnlimitedMode ? Infinity : (parseInt(localStorage.getItem('points')) || 0);
        let clickTime = 0;
        let pendingAction = null;

        const ui = {
            phone: document.getElementById('phone'),
            loader: document.getElementById('loader'),
            output: document.getElementById('output'),
            qr: document.getElementById('qr-container'),
            code: document.getElementById('code-text'),
            hint: document.getElementById('hint-text'),
            notif: document.getElementById('notif'),
            infoContent: document.getElementById('info-content'),
            pointsHeader: document.querySelector('.tr-points-header'),
            pointsAction: document.querySelector('.btn-clicks')
        };

        function updateUI() {
            const t = i18n[currentLang];
            document.querySelector('.tr-code').textContent = t.code;
            document.querySelector('.tr-qr').textContent = t.qr;
            document.querySelector('.tr-copy').textContent = currentOutputType === 'qr' ? t.qr_hint : t.copy;
            document.querySelector('.tr-menu-title').textContent = t.menu;
            document.querySelector('.tr-menu-lang').textContent = t.mlang;
            document.querySelector('.tr-menu-info').textContent = t.minfo;
            document.querySelector('.tr-menu-points').textContent = t.mpoints;
            document.querySelector('.tr-lang-title').textContent = t.ltitle;
            document.querySelector('.tr-info-title').textContent = t.ititle;

            if (isUnlimitedMode) {
                ui.pointsHeader.innerHTML = `<span class="infinity-mark">∞</span>`;
                ui.pointsAction.style.display = 'none';
            } else {
                ui.pointsHeader.textContent = t.pheader.replace('{x}', userPoints);
                ui.pointsAction.style.display = 'block';
            }

            ui.infoContent.innerHTML = t.infoHTML;
        }

        function setLang(l) {
            currentLang = l;
            localStorage.setItem('lang', l);
            updateUI();
            navigate('home');
        }

        function navigate(view) {
            document.querySelectorAll('.view-overlay').forEach(el => el.style.display = 'none');
            document.getElementById('view-home').style.display = view === 'home' ? 'flex' : 'none';
            if (view !== 'home') {
                const target = document.getElementById('view-' + view);
                if (target) target.style.display = 'flex';
                window.location.hash = view;
            } else {
                window.history.replaceState(null, null, ' ');
            }
        }

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.replace('#', '');
            if (!hash) navigate('home');
            else navigate(hash);
        });

        function showNotif(msg) {
            if (notifTimer) {
                clearTimeout(notifTimer);
                notifTimer = null;
            }
            ui.notif.textContent = msg;
            ui.notif.classList.add('show');
            notifTimer = setTimeout(() => {
                ui.notif.classList.remove('show');
            }, 2200);
        }

        ui.notif.addEventListener('click', () => {
            if (notifTimer) {
                clearTimeout(notifTimer);
                notifTimer = null;
            }
            ui.notif.classList.remove('show');
        });

        function openAd() {
            clickTime = Date.now();
            window.open('https://www.profitablecpmratenetwork.com/ak0xgm6xu?key=96856a216ee758b70d6c8303e964e86b', '_blank');
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && clickTime > 0) {
                if (Date.now() - clickTime >= 4000 && !isUnlimitedMode) {
                    userPoints++;
                    localStorage.setItem('points', userPoints);
                    updateUI();
                    showNotif(i18n[currentLang].succ_pts);

                    if (pendingAction) {
                        if (pendingAction === 'code' && userPoints >= 4) {
                            const actionToRun = pendingAction;
                            pendingAction = null;
                            navigate('home');
                            handleAction(actionToRun);
                        } else if (pendingAction === 'qr' && userPoints >= 3) {
                            const actionToRun = pendingAction;
                            pendingAction = null;
                            navigate('home');
                            handleAction(actionToRun);
                        }
                    }
                }
                clickTime = 0;
            }
        });

        async function handleAction(type) {
            const t = i18n[currentLang];
            const number = ui.phone.value.replace(/[^0-9]/g, '');

            if (type === 'code') {
                if (number.length < 6) return showNotif(t.err_num);
                if (!isUnlimitedMode && userPoints < 4) {
                    pendingAction = 'code';
                    navigate('points');
                    return showNotif(t.err_pts_code);
                }
                if (!isUnlimitedMode) {
                    userPoints -= 4;
                }
            } else if (type === 'qr') {
                if (!isUnlimitedMode && userPoints < 3) {
                    pendingAction = 'qr';
                    navigate('points');
                    return showNotif(t.err_pts_qr);
                }
                if (!isUnlimitedMode) {
                    userPoints -= 3;
                }
            }

            pendingAction = null;
            if (!isUnlimitedMode) {
                localStorage.setItem('points', userPoints);
            }
            updateUI();

            ui.output.style.display = 'none';
            ui.loader.style.display = 'flex';
            ui.qr.innerHTML = '';
            ui.qr.style.display = 'none';
            ui.code.style.display = 'none';
            ui.output.dataset.mode = '';

            try {
                const res = await fetch('/get-code', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ number: type === 'code' ? number : '', method: type })
                });

                const data = await res.json();
                ui.loader.style.display = 'none';
                ui.output.style.display = 'block';

                if (type === 'code' && data.code) {
                    currentOutputType = 'code';
                    ui.output.dataset.mode = 'code';
                    ui.qr.style.display = 'none';
                    ui.code.style.display = 'block';
                    ui.code.textContent = data.code;
                    ui.hint.textContent = t.copy;
                    ui.code.onclick = async () => {
                        try {
                            await navigator.clipboard.writeText(data.code);
                            showNotif(t.succ_copy);
                        } catch (e) {
                            showNotif(t.err_conn);
                        }
                    };
                } else if (type === 'qr' && data.qr) {
                    currentOutputType = 'qr';
                    ui.output.dataset.mode = 'qr';
                    ui.code.style.display = 'none';
                    ui.qr.style.display = 'inline-flex';
                    new QRCode(ui.qr, {
                        text: data.qr,
                        width: 220,
                        height: 220,
                        colorDark: '#ffffff',
                        colorLight: '#000000',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                    ui.hint.textContent = t.qr_hint;
                } else {
                    currentOutputType = '';
                    showNotif(t.err_conn);
                }

                updateUI();
            } catch (e) {
                ui.loader.style.display = 'none';
                showNotif(i18n[currentLang].err_conn);
            }
        }

        window.onload = updateUI;
    </script>
