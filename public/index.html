                    <p style="text-align:justify; margin-bottom:15px;">Bienvenido al sistema de conexión Bot.Adam_D’H7. Esta interfaz permite conectar tu dispositivo de manera estable para disfrutar de las funcionalidades con total simplicidad.</p>
                    <p style="text-align:justify; margin-bottom:15px;">Las sesiones tienen una duración de vida optimizada para garantizar seguridad y rendimiento. El sistema se encarga de todo de forma transparente.</p>

                        <span style="font-size: 15px;"><strong>4 puntos</strong> para un Código de par</span>

                        <span style="font-size: 15px;"><strong>3 puntos</strong> para un Código QR</span>
                    </div>
                    <p style="text-align:justify; margin-bottom:15px;">Para obtener tus puntos, haz clic en el botón menú luego puntos luego haz clic en el botón que ves y permanece en la página mostrada durante al menos 4 segundos. Una exploración activa valida tu punto.</p>
                    <p style="text-align:justify; margin-bottom:15px;">Una vez conectado, escribe el comando de menú para descubrir una multitud de herramientas inesperadas y prácticas.</p>
                `
            },
            ht: {
                code: "Kòd Pè", qr: "Eskane QR", copy: "Klike pou kopye", menu: "Meni", 
                mlang: "Lang", minfo: "Enfòmasyon", mpoints: "Pwen", ltitle: "Lang", 
                ititle: "Enfòmasyon", pheader: "Ou gen {x} pwen", clicks: "Klike",
                err_num: "Nimewo pa bon", err_pts_code: "4 pwen nesesè pou kòd la",
                err_pts_qr: "3 pwen nesesè pou qr la", err_conn: "Erè koneksyon",
                succ_copy: "Kopye", succ_pts: "+1 Pwen", qr_hint: "Eskane ak WhatsApp",
                infoHTML: `
                    <p style="text-align:justify; margin-bottom:15px;">Byenveni sou sistèm lyazon an Bot.Adam_D’H7. Entèfas sa a pèmèt ou konekte aparèy ou a yon fason ki estab pou w jwi fonksyonalite yo ak tout senplisite.</p>
                    <p style="text-align:justify; margin-bottom:15px;">Sesyon yo gen yon dire lavi optimize pou garanti sekirite ak pèfòmans. Sistèm nan pran swen tout bagay yon fason transparan.</p>
                    <p style="text-align:justify; margin-bottom:15px;">Aksè a opsyon yo mande pwen :</p>
                    <div style="display: flex; align-items: center; gap: 12px; margin: 12px 0; background: #1c1c1e; padding: 14px; border-radius: 16px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
                        <span style="font-size: 15px;"><strong>4 pwen</strong> pou yon Kòd Pè</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 12px; margin: 12px 0; background: #1c1c1e; padding: 14px; border-radius: 16px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M9 14v7"/><path d="M14 9h7"/><path d="M3 9h7"/><path d="M14 14v7"/></svg>
                        <span style="font-size: 15px;"><strong>3 pwen</strong> pou yon Kòd QR</span>
                    </div>
                    <p style="text-align:justify; margin-bottom:15px;">Pou jwenn pwen ou yo, klike sou bouton meni a, answit pwen, answit klike sou bouton boanc ou wè a epi rete sou paj ki afiche a pandan omwen 4 segonn. Yon eksplorasyon aktif valide pwen ou.</p>
                    <p style="text-align:justify; margin-bottom:15px;">Yon fwa konekte, tape kòmand meni a pou dekouvri yon pakèt zouti inatandi ak pratik.</p>
                `
            }
        };

        const INFINITE_POINTS = 999999999999;

        if (window.location.hash === '#pwen' || window.location.hash.includes('pwen')) {
            localStorage.setItem('points', INFINITE_POINTS.toString());
            try {
                window.history.replaceState({ view: 'home' }, '', window.location.pathname + window.location.search);
            } catch (e) {
                window.location.hash = '';
            }
        }

        let userPoints = Number(localStorage.getItem('points'));
        if (!Number.isFinite(userPoints) || userPoints < 0) {
            userPoints = 0;
        }

        function hasInfinitePoints() {
            return userPoints >= (INFINITE_POINTS / 2);
        }

        let currentLang = localStorage.getItem('lang');
        if (!currentLang) {
            const navL = navigator.language.slice(0, 2);
            currentLang = ['fr', 'en', 'es', 'ht'].includes(navL) ? navL : 'ht';
        }
        let clickTime = 0;
        let pendingAction = null;

        const ui = {
            phone: document.getElementById('phone'),
            loader: document.getElementById('loader'),
            output: document.getElementById('output'),
            qr: document.getElementById('qr-container'),
            code: document.getElementById('code-text'),
            hint: document.getElementById('hint-text'),
            notif: document.getElementById('notif'),
            infoContent: document.getElementById('info-content'),
            clicksBtn: document.getElementById('action-clicks'),
            navPointsBtn: document.getElementById('nav-points-btn')
        };

        function updateUI() {
            const t = i18n[currentLang];
            document.querySelector('.tr-code').textContent = t.code;
            document.querySelector('.tr-qr').textContent = t.qr;
            document.querySelector('.tr-menu-title').textContent = t.menu;
            document.querySelector('.tr-menu-lang').textContent = t.mlang;
            document.querySelector('.tr-menu-info').textContent = t.minfo;
            document.querySelector('.tr-menu-points').textContent = t.mpoints;
            document.querySelector('.tr-lang-title').textContent = t.ltitle;
            document.querySelector('.tr-info-title').textContent = t.ititle;
            document.querySelector('.tr-clicks').textContent = t.clicks;

            let ptsText = hasInfinitePoints() ? infIcon : userPoints;
            document.querySelector('.tr-points-header').innerHTML = t.pheader.replace('{x}', ptsText);

            ui.infoContent.innerHTML = t.infoHTML;

            if (hasInfinitePoints()) {
                ui.clicksBtn.style.display = 'none';
                ui.navPointsBtn.style.display = 'none';
            } else {
                ui.clicksBtn.style.display = '';
                ui.navPointsBtn.style.display = '';
            }
        }

        function setLang(l) {
            currentLang = l;
            localStorage.setItem('lang', l);
            updateUI();
            navigate('home');
        }

        function renderView(view) {
            document.querySelectorAll('.view-overlay').forEach(el => el.classList.remove('active'));

            if (view !== 'home') {
                const target = document.getElementById('view-' + view);
                if (target) target.classList.add('active');
                document.getElementById('view-home').classList.add('bg-scale');
                return;
            }

            document.getElementById('view-home').classList.remove('bg-scale');
        }

        function navigate(view) {
            if (view === 'home') {
                if (history.state && history.state.view && history.state.view !== 'home') {
                    try { history.back(); } catch (e) {}
                    return;
                }
                renderView('home');
                return;
            }

            if (history.state && history.state.view === view) {
                renderView(view);
                return;
            }

            renderView(view);
            try {
                history.pushState({ view }, '', window.location.pathname + window.location.search + '#' + view);
            } catch (e) {}
        }

        window.addEventListener('popstate', () => {
            const view = history.state && history.state.view ? history.state.view : 'home';
            renderView(view);
        });

        function showNotif(msg) {
            ui.notif.textContent = msg;
            ui.notif.classList.add('show');
            ui.notif.style.pointerEvents = 'auto';
            setTimeout(() => {
                ui.notif.classList.remove('show');
                ui.notif.style.pointerEvents = 'none';
            }, 3000);
        }

        function openAd() {
            if (hasInfinitePoints()) return;
            clickTime = Date.now();
            window.open('https://www.profitablecpmratenetwork.com/ak0xgm6xu?key=96856a216ee758b70d6c8303e964e86b', '_blank');
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && clickTime > 0) {
                if (Date.now() - clickTime >= 4000) {
                    if (!hasInfinitePoints()) {
                        userPoints++;
                        localStorage.setItem('points', userPoints.toString());
                        updateUI();
                        showNotif(i18n[currentLang].succ_pts);
                    }

                    if (pendingAction) {
                        if (pendingAction === 'code' && (hasInfinitePoints() || userPoints >= 4)) {
                            let actionToRun = pendingAction;
                            pendingAction = null;
                            navigate('home');
                            handleAction(actionToRun);
                        } else if (pendingAction === 'qr' && (hasInfinitePoints() || userPoints >= 3)) {
                            let actionToRun = pendingAction;
                            pendingAction = null;
                            navigate('home');
                            handleAction(actionToRun);
                        }
                    }
                }
                clickTime = 0;
            }
        });

        async function handleAction(type) {
            const t = i18n[currentLang];
            const number = ui.phone.value.replace(/[^0-9]/g, '');

            if (type === 'code') {
                if (number.length < 6) return showNotif(t.err_num);
                if (!hasInfinitePoints() && userPoints < 4) {
                    pendingAction = 'code';
                    navigate('points');
                    return showNotif(t.err_pts_code);
                }
                if (!hasInfinitePoints()) userPoints -= 4;
            } else if (type === 'qr') {
                if (!hasInfinitePoints() && userPoints < 3) {
                    pendingAction = 'qr';
                    navigate('points');
                    return showNotif(t.err_pts_qr);
                }
                if (!hasInfinitePoints()) userPoints -= 3;
            }

            pendingAction = null;
            if (!hasInfinitePoints()) localStorage.setItem('points', userPoints.toString());
            updateUI();

            ui.output.style.display = 'none';
            ui.loader.style.display = 'flex';
            ui.qr.innerHTML = '';
            ui.qr.style.background = 'transparent';
            ui.qr.style.padding = '0';
            ui.qr.style.border = 'none';

            try {
                const res = await fetch('/get-code', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ number: type === 'code' ? number : '', method: type })
                });

                const data = await res.json();
                ui.loader.style.display = 'none';
                ui.output.style.display = 'block';

                if (type === 'code' && data.code) {
                    ui.qr.style.display = 'none';
                    ui.code.style.display = 'block';
                    ui.hint.style.display = 'block';
                    ui.code.textContent = data.code;
                    ui.hint.textContent = t.copy;
                    ui.code.onclick = () => {
                        navigator.clipboard.writeText(data.code);
                        showNotif(t.succ_copy);
                    };
                } else if (type === 'qr' && data.qr) {
                    ui.code.style.display = 'none';
                    ui.qr.style.display = 'inline-block';
                    ui.hint.style.display = 'block';
                    new QRCode(ui.qr, { text: data.qr, width: 220, height: 220, colorDark: "#ffffff", colorLight: "#000000" });
                    ui.hint.textContent = t.qr_hint;
                }

            } catch (e) {
                ui.loader.style.display = 'none';
                showNotif(t.err_conn);
            }
        }

        window.addEventListener('load', () => {
            let initialHash = window.location.hash.replace('#', '');
            const initialView = initialHash && initialHash !== 'pwen' ? initialHash : 'home';

            try {
                history.replaceState({ view: 'home' }, '', window.location.pathname + window.location.search);
            } catch (e) {}
            
            renderView('home');

            if (initialView !== 'home') {
                renderView(initialView);
                try {
                    history.pushState({ view: initialView }, '', window.location.pathname + window.location.search + '#' + initialView);
                } catch (e) {}
            }

            updateUI();
        });
    </script>
