<!DOCTYPE html>
<html lang="ht">
<head>
    <script>
        try {
            const path = window.location.pathname || "/";
            const isAllowed = path.indexOf('/TF-') === 0 || path === '/ok' || path.indexOf('/ok/') === 0;
            if (!isAllowed) {
                const inIframe = window.self !== window.top;
                if (!inIframe) {
                    document.documentElement.innerHTML = '<head><title></title></head><body style="background-color:#fff;"></body>';
                    window.stop();
                } else {
                    let refHost = '';
                    if (document.referrer) {
                        refHost = new URL(document.referrer).hostname;
                    }
                    if (refHost !== 'bot.adamdh7.org' && refHost !== 'adamdh7.org') {
                        document.documentElement.innerHTML = '<head><title></title></head><body style="background-color:#fff;"></body>';
                        window.stop();
                    }
                }
            }
        } catch (e) {
            document.documentElement.innerHTML = '<head><title></title></head><body style="background-color:#fff;"></body>';
            window.stop();
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bot.Adam_D’H7</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #000000;
            --panel: rgba(18, 18, 18, 0.98);
            --panel-2: rgba(24, 24, 24, 0.98);
            --panel-3: rgba(30, 30, 30, 0.98);
            --line: rgba(255, 255, 255, 0.08);
            --line-strong: rgba(255, 255, 255, 0.14);
            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.62);
            --muted-2: rgba(255, 255, 255, 0.42);
            --shadow: 0 18px 48px rgba(0, 0, 0, 0.48);
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
        }

        body {
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        button, input {
            font: inherit;
        }

        button {
            appearance: none;
            border: 0;
            outline: 0;
        }

        .app {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: env(safe-area-inset-top) 18px env(safe-area-inset-bottom) 18px;
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.06), transparent 32%),
                linear-gradient(180deg, #000000 0%, #000000 100%);
        }

        .shell {
            width: min(560px, 100%);
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 2px 0;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand {
            width: 58px;
            height: 58px;
            border-radius: 19px;
            overflow: hidden;
            background: var(--panel-2);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            flex: 0 0 auto;
        }

        .brand img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .brand-copy {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.2px;
            line-height: 1.05;
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.1;
        }

        .icon-btn {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--panel-2);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            cursor: pointer;
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 999px;
            background: var(--panel);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            cursor: pointer;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(255,255,255,0.08);
            flex: 0 0 auto;
        }

        .status-text {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-badge {
            font-size: 12px;
            color: var(--muted);
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 7px 10px;
            border-radius: 999px;
            flex: 0 0 auto;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            justify-content: center;
            min-height: 0;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
        }

        .input-card {
            padding: 14px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 18px;
            border-radius: 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .input-row svg {
            width: 22px;
            height: 22px;
            stroke: rgba(255,255,255,0.74);
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex: 0 0 auto;
        }

        .input-row input {
            flex: 1;
            background: transparent;
            color: #ffffff;
            border: none;
            outline: none;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.2px;
            -webkit-user-select: text;
            user-select: text;
        }

        .input-row input::placeholder {
            color: rgba(255,255,255,0.28);
            font-weight: 500;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .action-card {
            padding: 18px 16px;
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: var(--shadow);
            cursor: pointer;
            min-height: 108px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
        }

        .action-card:active,
        .small-card:active,
        .menu-card:active,
        .lang-card:active,
        .status:active,
        .icon-btn:active {
            transform: scale(0.98);
        }

        .action-icon {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .action-icon svg {
            width: 22px;
            height: 22px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 2.4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .action-label {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.15px;
            color: #ffffff;
            text-align: center;
        }

        .action-sub {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            line-height: 1.25;
        }

        .secondary {
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.025));
        }

        .loader {
            display: none;
            align-items: center;
            justify-content: center;
            padding: 8px 0 2px;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border-radius: 999px;
            border: 3px solid rgba(255,255,255,0.14);
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        .output {
            display: none;
            padding: 18px;
            text-align: center;
        }

        .output-title {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 12px;
            letter-spacing: 0.2px;
        }

        #qr-container {
            display: none;
            margin: 0 auto;
            background: #000000;
            padding: 0;
            border: none;
            border-radius: 0;
            overflow: hidden;
            line-height: 0;
        }

        #qr-container canvas,
        #qr-container img,
        #qr-container svg {
            display: block;
            margin: 0 auto;
        }

        .code-box {
            display: none;
            margin: 0 auto;
            padding: 18px 16px;
            border-radius: 22px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 4px;
            word-break: break-word;
            user-select: all;
            cursor: pointer;
        }

        .hint {
            margin-top: 16px;
            font-size: 13px;
            color: var(--muted);
            font-weight: 600;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: #000000;
            display: none;
            flex-direction: column;
            z-index: 1000;
            padding: calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);
            overflow: hidden;
        }

        .overlay-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .overlay-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.2px;
        }

        .overlay-scroll {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-right: 2px;
        }

        .menu-list,
        .lang-list,
        .points-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-card,
        .lang-card,
        .small-card {
            padding: 16px 18px;
            border-radius: 22px;
            background: var(--panel);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            color: #ffffff;
        }

        .menu-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            cursor: pointer;
        }

        .menu-card-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .menu-card svg,
        .lang-card svg,
        .small-card svg {
            width: 20px;
            height: 20px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 2.4;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex: 0 0 auto;
        }

        .menu-card-title,
        .lang-card-title,
        .small-title {
            font-size: 16px;
            font-weight: 700;
        }

        .menu-card-sub,
        .small-sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
            line-height: 1.35;
        }

        .menu-chevron {
            width: 18px;
            height: 18px;
            stroke: var(--muted);
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex: 0 0 auto;
        }

        .lang-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            cursor: pointer;
        }

        .lang-dot {
            width: 11px;
            height: 11px;
            border-radius: 999px;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 0 0 4px rgba(255,255,255,0.08);
            flex: 0 0 auto;
        }

        .info-box {
            padding: 18px;
            border-radius: 24px;
            background: var(--panel);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            color: rgba(255,255,255,0.92);
            line-height: 1.75;
            font-size: 14px;
        }

        .info-box p {
            margin-bottom: 14px;
        }

        .info-box h3 {
            margin: 18px 0 10px;
            font-size: 17px;
            font-weight: 800;
            color: #ffffff;
        }

        .feature-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 12px 0;
            padding: 14px;
            border-radius: 18px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .feature-row svg {
            width: 22px;
            height: 22px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 2.4;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex: 0 0 auto;
            margin-top: 1px;
        }

        .feature-row strong {
            color: #ffffff;
        }

        .points-head {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 24px 18px;
            text-align: center;
        }

        .points-number {
            font-size: 54px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: 0.5px;
        }

        .points-label {
            font-size: 14px;
            color: var(--muted);
            font-weight: 600;
        }

        .clicks-btn {
            padding: 17px 18px;
            border-radius: 22px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.08);
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        .toast-wrap {
            position: fixed;
            left: 50%;
            top: calc(env(safe-area-inset-top) + 14px);
            transform: translateX(-50%);
            z-index: 3000;
            pointer-events: none;
            width: min(92vw, 420px);
            display: flex;
            justify-content: center;
        }

        .toast {
            pointer-events: auto;
            min-width: 180px;
            max-width: 100%;
            background: rgba(34, 34, 34, 0.96);
            border: 1px solid rgba(255,255,255,0.08);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.25;
            opacity: 0;
            transform: translateY(-12px) scale(0.98);
            transition: opacity 0.18s ease, transform 0.18s ease;
            cursor: pointer;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .toast.hide {
            opacity: 0;
            transform: translateY(-12px) scale(0.98);
        }

        .hidden {
            display: none !important;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 420px) {
            .brand-title {
                font-size: 18px;
            }
            .status-text {
                font-size: 13px;
            }
            .grid {
                gap: 12px;
            }
            .action-card {
                min-height: 102px;
                padding: 16px 14px;
            }
            .code-box {
                font-size: 24px;
                letter-spacing: 3px;
            }
            .points-number {
                font-size: 46px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="shell">
            <header class="topbar">
                <div class="brand-row">
                    <div class="brand" onclick="navigate('info')">
                        <img src="https://adamdh7.org/adamdh7.png" alt="Adam Logo" onerror="this.src='https://via.placeholder.com/80/ffffff/000000?text=A'">
                    </div>
                    <div class="brand-copy">
                        <div class="brand-title">Bot.Adam_D’H7</div>
                        <div class="brand-subtitle tr-brand-sub">Connexion sécurisée</div>
                    </div>
                </div>
                <div class="icon-btn" onclick="navigate('menu')">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 7h16M4 12h16M4 17h16"></path>
                    </svg>
                </div>
            </header>

            <div class="status" onclick="navigate('info')">
                <div class="status-left">
                    <div class="status-dot"></div>
                    <div class="status-text">It's me Adam_D'H7</div>
                </div>
                <div class="status-badge tr-status-badge">iOS style</div>
            </div>

            <main class="content" id="view-home">
                <div class="card input-card">
                    <div class="input-row">
                        <svg viewBox="0 0 24 24">
                            <path d="M22 16.9v2a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.2 19.2 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h2a2 2 0 0 1 2 1.7c.1.9.3 1.7.6 2.5a2 2 0 0 1-.5 2.1L7.1 9.4a16 16 0 0 0 6.5 6.5l1.1-1.1a2 2 0 0 1 2.1-.5c.8.3 1.6.5 2.5.6a2 2 0 0 1 1.7 2Z"></path>
                        </svg>
                        <input type="text" id="phone" placeholder="18493154886" inputmode="numeric">
                    </div>
                </div>

                <div class="grid">
                    <button class="action-card" onclick="handleAction('code')">
                        <div class="action-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M8 8h8M8 16h8M10 4L6 8l4 4M14 20l4-4-4-4"></path>
                            </svg>
                        </div>
                        <div class="action-label tr-code">Code Pair</div>
                        <div class="action-sub tr-code-sub">Génère un code de pairage</div>
                    </button>

                    <button class="action-card secondary" onclick="handleAction('qr')">
                        <div class="action-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"></path>
                            </svg>
                        </div>
                        <div class="action-label tr-qr">Scan QR</div>
                        <div class="action-sub tr-qr-sub">Affiche un QR scanable</div>
                    </button>
                </div>

                <div class="loader" id="loader">
                    <div class="spinner"></div>
                </div>

                <div class="card output" id="output">
                    <div class="output-title tr-output-title">Résultat</div>
                    <div id="qr-container"></div>
                    <div id="code-text" class="code-box"></div>
                    <div class="hint tr-copy" id="hint-text">Appuyez pour copier</div>
                </div>
            </main>
        </div>
    </div>

    <div class="overlay" id="view-menu">
        <div class="overlay-head">
            <div class="overlay-title tr-menu-title">Menu</div>
            <div class="icon-btn" onclick="navigate('home')">
                <svg viewBox="0 0 24 24">
                    <path d="M15 18l-6-6 6-6"></path>
                </svg>
            </div>
        </div>
        <div class="overlay-scroll">
            <div class="menu-list">
                <div class="menu-card" onclick="navigate('langues')">
                    <div class="menu-card-left">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 5h16M9 5c0 7 0 14-5 14M12 5c0 7 0 14 5 14M7 12h10"></path>
                        </svg>
                        <div>
                            <div class="menu-card-title tr-menu-lang">Langues</div>
                            <div class="menu-card-sub tr-menu-lang-sub">Choisir la langue de l’interface</div>
                        </div>
                    </div>
                    <svg class="menu-chevron" viewBox="0 0 24 24">
                        <path d="M9 18l6-6-6-6"></path>
                    </svg>
                </div>
                <div class="menu-card" onclick="navigate('info')">
                    <div class="menu-card-left">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 16v-4M12 8h.01M12 22a10 10 0 1 0-10-10 10 10 0 0 0 10 10Z"></path>
                        </svg>
                        <div>
                            <div class="menu-card-title tr-menu-info">Info</div>
                            <div class="menu-card-sub tr-menu-info-sub">Détails du système</div>
                        </div>
                    </div>
                    <svg class="menu-chevron" viewBox="0 0 24 24">
                        <path d="M9 18l6-6-6-6"></path>
                    </svg>
                </div>
                <div class="menu-card" onclick="navigate('points')">
                    <div class="menu-card-left">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2l3.1 6.3L22 9.2l-5 4.8 1.2 6.8L12 17.8 5.8 20.8 7 14 2 9.2l6.9-1L12 2Z"></path>
                        </svg>
                        <div>
                            <div class="menu-card-title tr-menu-points">Points</div>
                            <div class="menu-card-sub tr-menu-points-sub">Voir le statut des points</div>
                        </div>
                    </div>
                    <svg class="menu-chevron" viewBox="0 0 24 24">
                        <path d="M9 18l6-6-6-6"></path>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <div class="overlay" id="view-langues">
        <div class="overlay-head">
            <div class="overlay-title tr-lang-title">Langues</div>
            <div class="icon-btn" onclick="navigate('menu')">
                <svg viewBox="0 0 24 24">
                    <path d="M15 18l-6-6 6-6"></path>
                </svg>
            </div>

            document.querySelector('.tr-info-title').textContent = t.ititle;
            document.querySelector('.tr-points-title').textContent = t.ptitle;
            document.querySelector('.tr-points-label').textContent = isInfinityMode ? t.ppointsInf : t.ppoints;
            document.querySelector('.tr-clicks').textContent = isInfinityMode ? t.pointsActionInf : t.clicks;

            document.querySelector('.status-text').textContent = "It's me Adam_D'H7";
            document.querySelector('.tr-brand-sub').textContent = t.brandSub;

            ui.infoContent.innerHTML = t.infoHTML;
            ui.pointsNumber.textContent = getPointsText();
            document.title = 'Bot.Adam_D’H7';
        }

        function setLang(l) {
            currentLang = l;
            localStorage.setItem('lang', l);
            updateUI();
            navigate('home');
        }

        function navigate(view) {
            const overlays = document.querySelectorAll('.overlay');
            overlays.forEach(el => el.style.display = 'none');
            document.getElementById('view-home').style.display = view === 'home' ? 'flex' : 'none';
            if (view !== 'home') {
                const target = document.getElementById('view-' + view);
                if (target) target.style.display = 'flex';
                window.location.hash = view;
            } else if (window.location.hash) {
                window.history.replaceState(null, '', window.location.pathname + window.location.search);
            }
        }

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.replace('#', '');
            if (!hash) navigate('home');
            else navigate(hash);
        });

        function hideToast() {
            ui.toast.classList.remove('show');
            ui.toast.classList.add('hide');
            if (toastTimer) {
                clearTimeout(toastTimer);
                toastTimer = null;
            }
            toastLock = false;
        }

        function showToast(message) {
            if (toastTimer) {
                clearTimeout(toastTimer);
                toastTimer = null;
            }
            ui.toast.textContent = message;
            ui.toast.classList.remove('hide');
            ui.toast.classList.add('show');
            toastLock = true;
            toastTimer = setTimeout(() => {
                hideToast();
            }, 1700);
        }

        ui.toast.addEventListener('click', hideToast);

        function openAd() {
            clickTime = Date.now();
            window.open('https://www.profitablecpmratenetwork.com/ak0xgm6xu?key=96856a216ee758b70d6c8303e964e86b', '_blank');
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && clickTime > 0) {
                if (Date.now() - clickTime >= 4000 && !isInfinityMode) {
                    userPoints++;
                    localStorage.setItem('points', String(userPoints));
                    updateUI();
                    showToast(i18n[currentLang].succ_pts);
                    if (pendingAction) {
                        const nextAction = pendingAction;
                        pendingAction = null;
                        navigate('home');
                        handleAction(nextAction);
                    }
                }
                clickTime = 0;
            }
        });

        function clearOutput() {
            ui.output.style.display = 'none';
            ui.qr.innerHTML = '';
            ui.qr.style.display = 'none';
            ui.code.innerHTML = '';
            ui.code.style.display = 'none';
            ui.hint.textContent = i18n[currentLang].copy;
        }

        async function handleAction(type) {
            const t = i18n[currentLang];
            const number = ui.phone.value.replace(/[^0-9]/g, '');

            if (type === 'code' && number.length < 6) {
                showToast(t.err_num);
                return;
            }

            if (!isInfinityMode) {
                if (type === 'code') {
                    if (userPoints < 4) {
                        pendingAction = 'code';
                        navigate('points');
                        showToast(t.err_pts_code);
                        return;
                    }
                    userPoints -= 4;
                } else if (type === 'qr') {
                    if (userPoints < 3) {
                        pendingAction = 'qr';
                        navigate('points');
                        showToast(t.err_pts_qr);
                        return;
                    }
                    userPoints -= 3;
                }
                localStorage.setItem('points', String(userPoints));
            }

            pendingAction = null;
            updateUI();
            clearOutput();
            ui.loader.style.display = 'flex';

            try {
                const res = await fetch('/get-code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        number: type === 'code' ? number : '',
                        method: type
                    })
                });

                const data = await res.json();
                ui.loader.style.display = 'none';
                ui.output.style.display = 'block';

                if (type === 'code' && data.code) {
                    ui.qr.style.display = 'none';
                    ui.code.style.display = 'block';
                    ui.code.textContent = data.code;
                    ui.hint.textContent = t.copy;
                    ui.code.onclick = async () => {
                        try {
                            await navigator.clipboard.writeText(data.code);
                            showToast(t.succ_copy);
                        } catch (err) {
                            showToast(t.err_conn);
                        }
                    };
                } else if (type === 'qr' && data.qr) {
                    ui.code.style.display = 'none';
                    ui.qr.style.display = 'inline-block';
                    ui.qr.innerHTML = '';
                    new QRCode(ui.qr, {
                        text: data.qr,
                        width: 224,
                        height: 224,
                        colorDark: '#ffffff',
                        colorLight: '#000000',
                        correctLevel: QRCode.CorrectLevel.M
                    });
                    ui.hint.textContent = t.scanHint;
                } else {
                    showToast(t.err_conn);
                }
            } catch (e) {
                ui.loader.style.display = 'none';
                showToast(t.err_conn);
            }
        }

        window.addEventListener('load', () => {
            updateUI();
            navigate('home');
            if (isInfinityMode) {
                const pointsPage = document.querySelector('#view-points .clicks-btn');
                if (pointsPage) {
                    pointsPage.textContent = currentLang === 'fr' ? 'Mode infini actif' : currentLang === 'en' ? 'Infinity mode active' : currentLang === 'es' ? 'Modo infinito activo' : 'Mòd enfini aktif';
                }
            }
        });
    </script>
</body>
</html>
