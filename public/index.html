<!DOCTYPE html>
<html lang="ht">
<head>
    <script>
        try {
            const isAllowedHost = window.location.hostname === 'bot.adamdh7.org';
            const inIframe = window.self !== window.top;
            if (!isAllowedHost && !inIframe) {
                document.documentElement.innerHTML = '<head><title></title></head><body style="background-color: white; margin: 0;"></body>';
                window.stop();
            }
        } catch (e) {
            document.documentElement.innerHTML = '<head><title></title></head><body style="background-color: white; margin: 0;"></body>';
            window.stop();
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bot (tfbot)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-dark: #000000;
            --text-main: #ffffff;
            --text-muted: #888888;
            --glass: #1c1c1e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y;
            overscroll-behavior: none;
            min-width: 0;
        }
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            scrollbar-width: none;
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }
        .app-container:focus,
        .view-overlay:focus {
            outline: none;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            height: 100dvh;
            min-height: 100vh;
            width: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-user-select: none;
            user-select: none;
        }
        .app-container {
            width: 100%;
            height: 100%;
            height: 100dvh;
            min-height: 0;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: max(env(safe-area-inset-top), 12px) clamp(16px, 4.5vw, 28px) max(env(safe-area-inset-bottom), 12px);
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: none;
            scrollbar-width: none;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease;
        }
        .app-container.bg-scale {
            transform: scale(0.92);
            opacity: 0.4;
            pointer-events: none;
        }
        .header {
            text-align: center;
            margin-top: clamp(2vh, 4vh, 40px);
            margin-bottom: clamp(1vh, 2vh, 20px);
            position: relative;
        }
        .header-top {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 16px;
        }
        .logo-area {
            width: clamp(60px, 15vw, 80px);
            height: clamp(60px, 15vw, 80px);
            border-radius: 20px;
            overflow: hidden;
            cursor: default;
            pointer-events: none;
            -webkit-touch-callout: none;
            user-select: none;
        }
        .logo-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
            user-select: none;
        }
        .menu-icon {
            position: absolute;
            right: 10px;
            cursor: pointer;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-icon svg {
            width: 26px;
            height: 26px;
            stroke: #ffffff;
        }
        h1 {
            font-size: clamp(22px, 6vw, 28px);
            font-weight: 700;
            color: #ffffff;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--glass);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: clamp(11px, 3.5vw, 13px);
            font-weight: 500;
            color: #ffffff;
            margin-top: 10px;
            cursor: pointer;
            border: none;
        }
        .main-content {
            flex: 1 0 auto;
            min-height: 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: clamp(12px, 3vh, 20px);
            padding-bottom: 12px;
        }
        .input-wrapper {
            background: var(--glass);
            border-radius: 18px;
            padding: clamp(14px, 4vw, 18px);
            display: flex;
            align-items: center;
            border: none;
        }
        .input-wrapper svg {
            margin-right: 12px;
            min-width: 20px;
        }
        input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: clamp(16px, 4.5vw, 18px);
            width: 100%;
            outline: none;
            font-family: 'Outfit', sans-serif;
            -webkit-user-select: auto;
            user-select: auto;
        }
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(10px, 3vw, 15px);
            margin-top: 10px;
        }
        .btn {
            background: #ffffff;
            color: #000000;
            padding: clamp(15px, 4vw, 20px);
            border-radius: 18px;
            font-size: clamp(14px, 4vw, 16px);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Outfit', sans-serif;
            border: none;
        }
        .btn svg {
            stroke: #000000;
        }
        .btn-secondary {
            background: var(--glass);
            color: #ffffff;
        }
        .btn-secondary svg {
            stroke: #ffffff;
        }
        .output-area {
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        .code-box {
            font-family: 'Courier New', monospace;
            font-size: clamp(24px, 8vw, 32px);
            color: #ffffff;
            letter-spacing: 4px;
            margin: 15px 0;
            font-weight: bold;
            word-break: break-all;
        }
        .copy-hint {
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .loader-container {
            display: none;
            justify-content: center;
            padding: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }
        #qr-container {
            background: transparent;
            padding: 0;
            display: inline-block;
            margin: 0 auto;
        }
        #qr-container img {
            width: clamp(160px, 50vw, 220px) !important;
            height: clamp(160px, 50vw, 220px) !important;
        }
        .notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: rgba(40, 40, 40, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 500;
            opacity: 0;
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease-in-out;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }
        .notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .view-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: max(40px, env(safe-area-inset-top)) clamp(16px, 5vw, 30px) max(24px, env(safe-area-inset-bottom));
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: none;
            scrollbar-width: none;
            transform: translateX(100%);
            visibility: hidden;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.35s;
        }
        .view-overlay.active {
            transform: translateX(0);
            visibility: visible;
            pointer-events: auto;
        }
        .overlay-close {
            position: absolute;
            top: clamp(15px, 4vh, 24px);
            left: 20px;
            cursor: pointer;
            padding: 10px;
            z-index: 1001;
        }
        .view-overlay h2 {
            margin-top: 15px;
            margin-bottom: 30px;
            text-align: center;
            font-size: clamp(20px, 6vw, 24px);
        }
        .menu-item {
            padding: clamp(16px, 4vw, 20px);
            border: none;
            border-radius: 16px;
            margin-bottom: 12px;
            text-align: center;
            font-size: clamp(15px, 4.5vw, 17px);
            font-weight: 500;
            cursor: pointer;
            background: var(--glass);
            color: #ffffff;
        }
        .lang-btn {
            padding: clamp(16px, 4vw, 20px);
            border: none;
            border-radius: 16px;
            margin-bottom: 12px;
            text-align: center;
            font-size: clamp(15px, 4.5vw, 17px);
            font-weight: 500;
            background: var(--glass);
            color: #ffffff;
            cursor: pointer;
        }
        .info-container {
            width: 100%;
            text-align: left;
            color: #d1d1d6;
            font-size: clamp(14px, 3.8vw, 16px);
            line-height: 1.75;
            margin: 0 auto 20px;
            overflow-wrap: anywhere;
            flex: 1 0 auto;
        }
        .points-header {
            font-size: clamp(18px, 5vw, 20px);
            text-align: center;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-clicks {
            background: var(--glass);
            color: #ffffff;
            padding: clamp(16px, 4vw, 20px);
            border-radius: 16px;
            text-align: center;
            font-weight: 600;
            font-size: clamp(16px, 4.5vw, 18px);
            cursor: pointer;
            border: none;
            width: 100%;
        }

        .social-links-shell {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .social-links-row {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0 4px;
            gap: clamp(8px, 2.5vw, 20px);
        }
        .social-links-row::-webkit-scrollbar {
            display: none;
        }
        .social-link {
            flex: 0 0 auto;
            width: clamp(28px, 7vw, 36px);
            height: clamp(28px, 7vw, 36px);
            border-radius: 0;
            background: transparent;
            border: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-decoration: none;
            box-shadow: none;
            transition: transform 0.18s ease, opacity 0.18s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .social-link svg {
            width: 100%;
            height: 100%;
            max-width: 26px;
            max-height: 26px;
            fill: currentColor;
            display: block;
        }
        .social-link:hover,
        .social-link:active {
            transform: translateY(-1px) scale(1.05);
            opacity: 0.82;
        }
        .social-footer {
            margin-top: auto;
            width: 100%;
            padding-top: 10px;
            padding-bottom: max(6px, env(safe-area-inset-bottom));
        }
        .social-footer.points-footer {
            margin-top: 10px;
            padding-top: 0;
        }
        .social-menu-top {
            margin-top: 8px;
            margin-bottom: 10px;
        }
        .info-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .info-container p {
            text-align: left !important;
            margin: 0 !important;
            color: #d1d1d6;
            line-height: 1.75;
        }
        .info-container > div {
            margin: 0 !important;
            background: #151517 !important;
            border-radius: 16px;
            padding: 16px !important;
            gap: 14px !important;
        }
        .info-container > div span {
            font-size: clamp(14px, 3.8vw, 16px) !important;
            line-height: 1.5;
        }
        #qr-open-link {
            display: none;
            width: fit-content;
            max-width: 100%;
            margin: 0 auto;
            padding: 10px;
            background: #ffffff;
            border-radius: 16px;
            cursor: pointer;
            -webkit-touch-callout: none;
        }
        #qr-container {
            display: block;
            line-height: 0;
            margin: 0 auto;
        }
        #qr-container img,
        #qr-container canvas {
            display: block;
            width: clamp(180px, 58vw, 260px) !important;
            height: auto !important;
            max-width: 100%;
            border: 0;
            pointer-events: none;
            -webkit-touch-callout: none;
        }
        #qr-container canvas {
            height: clamp(180px, 58vw, 260px) !important;
        }
        .app-container::-webkit-scrollbar,
        .view-overlay::-webkit-scrollbar {
            display: none;
        }
        @media (hover: hover) and (pointer: fine) {
            .app-container,
            .view-overlay {
                scrollbar-width: thin;
                scrollbar-color: #555555 #111111;
            }
            .app-container::-webkit-scrollbar,
            .view-overlay::-webkit-scrollbar {
                display: block;
                width: 8px;
            }
            .app-container::-webkit-scrollbar-track,
            .view-overlay::-webkit-scrollbar-track {
                background: #111111;
            }
            .app-container::-webkit-scrollbar-thumb,
            .view-overlay::-webkit-scrollbar-thumb {
                background: #555555;
                border-radius: 8px;
            }
        }
        @media (max-height: 700px) {
            .header {
                margin-top: 4px;
                margin-bottom: 8px;
            }
            .header-top {
                margin-bottom: 7px;
            }
            .logo-area {
                width: clamp(48px, 11vh, 68px);
                height: clamp(48px, 11vh, 68px);
                border-radius: 16px;
            }
            .main-content {
                justify-content: flex-start;
            }
            .btn {
                padding: clamp(12px, 2.5vh, 18px);
                gap: 8px;
            }
        }
        @media (max-width: 360px) {
            .app-container {
                padding-left: 12px;
                padding-right: 12px;
            }
            .action-grid {
                gap: 8px;
            }
            .btn {
                padding-left: 9px;
                padding-right: 9px;
                font-size: 14px;
            }
            .status-badge {
                padding: 8px 11px;
            }
            .social-links-row {
                gap: 6px;
            }
        }
        @media (min-width: 681px) {
            .app-container {
                max-width: 760px;
            }
            .main-content {
                width: min(100%, 560px);
                align-self: center;
            }
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="app-container" id="view-home" tabindex="0">
        <header class="header">
            <div class="header-top">
                <div class="logo-area" aria-hidden="true">
                    <img src="https://adamdh7.org/asset/nwa.png" alt="" draggable="false" oncontextmenu="return false" onerror="this.src='https://via.placeholder.com/80/ffffff/000000?text=A'">
                </div>
                <div class="menu-icon" onclick="navigate('menu')">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </div>
            </div>

            <button class="status-badge" onclick="navigate('info')">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                <span>It’s Us Adam D’H7</span>
            </button>
        </header>
        <main class="main-content">
            <div class="input-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                <input type="text" id="phone" placeholder="22363817400" inputmode="tel" autocomplete="tel-national" maxlength="32" spellcheck="false" aria-label="Phone number" autocapitalize="off">
            </div>
            <div class="action-grid">
                <button class="btn" onclick="handleAction('code')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
                    <span class="tr-code">Code Pair</span>
                </button>
                <button class="btn btn-secondary" onclick="handleAction('qr')">

                    <span class="tr-qr">Scan QR</span>
                </button>
            </div>
            <div class="loader-container" id="loader">
                <div class="spinner"></div>
            </div>
            <div class="output-area" id="output">
                <a id="qr-open-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="Open QR code in a new tab">
                    <div id="qr-container" style="display:none;"></div>
                </a>
                <div id="code-text" class="code-box" style="display:none;"></div>
                <div class="copy-hint tr-copy" id="hint-text"></div>
            </div>
        </main>
    </div>

    <div class="view-overlay" id="view-menu" tabindex="0">
        <div class="overlay-close" onclick="navigate('home')">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </div>
        <h2 class="tr-menu-title">Menu</h2>
        <div class="social-links-shell social-menu-top">
            <div class="social-links-row" id="menu-social-links"></div>
        </div>
        <button class="menu-item tr-menu-lang" onclick="navigate('langues')">Langues</button>
        <button class="menu-item tr-menu-info" onclick="navigate('info')">Info</button>
        <button class="menu-item tr-menu-points" id="nav-points-btn" onclick="navigate('points')">Points</button>
    </div>

    <div class="view-overlay" id="view-langues" tabindex="0">
        <div class="overlay-close" onclick="navigate('home')">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </div>
        <h2 class="tr-lang-title">Langues</h2>
        <button class="lang-btn" onclick="setLang('fr')">Français</button>
        <button class="lang-btn" onclick="setLang('en')">English</button>
        <button class="lang-btn" onclick="setLang('es')">Español</button>
        <button class="lang-btn" onclick="setLang('ht')">Kreyòl Ayisyen</button>
    </div>

    <div class="view-overlay" id="view-info" tabindex="0">
        <div class="overlay-close" onclick="navigate('home')">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </div>
        <h2 class="tr-info-title">Info</h2>
        <div class="info-container" id="info-content"></div>
        <div class="social-footer">
            <div class="social-links-shell">
                <div class="social-links-row" id="info-social-links"></div>
            </div>
        </div>
    </div>

    <div class="view-overlay" id="view-points" tabindex="0">
        <div class="overlay-close" onclick="navigate('home')">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </div>
        <div class="points-header tr-points-header">Tu as 0 points</div>
        <button class="btn-clicks tr-clicks" id="action-clicks" onclick="openAd()">Clicks</button>
        <div class="social-footer points-footer">
            <div class="social-links-shell">
                <div class="social-links-row" id="points-social-links"></div>
            </div>
        </div>
    </div>

    <div class="notification" id="notif" onclick="this.classList.remove('show'); this.style.pointerEvents='none';"></div>

    <script>
        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('.view-overlay') || e.target.closest('#view-home')) return;
            e.preventDefault();
        }, { passive: false });

        const fallbackStorage = new Map();

            getItem(key) {

            setItem(key, value) {

                const safeValue = String(value);
                fallbackStorage.set(safeKey, safeValue);
                try { window.localStorage.setItem(safeKey, safeValue); } catch (error) {}
            },
            removeItem(key) {
                fallbackStorage.delete(String(key));

            }

        async function requestIframeStorageAccess() {
            try {
                if (window.top === window) return;
                if (navigator.storage && typeof navigator.storage.persist === 'function') await navigator.storage.persist();

            document.querySelectorAll('.view-overlay').forEach(el => el.classList.remove('active'));

            if (view !== 'home') {
                const target = document.getElementById('view-' + view);
                if (target) target.classList.add('active');

            if (view === 'home') {

                    return;

                renderView('home');

            if (history.state && history.state.view === view) {

            const input = ui.phone;
            const original = input.value;
            const cursor = input.selectionStart;
            const cleaned = original.replace(/[^0-9()+\-]/g, '');

                const removedBeforeCursor = original.slice(0, cursor || 0).length - original.slice(0, cursor || 0).replace(/[^0-9()+\-]/g, '').length;

                const nextCursor = Math.max(0, (cursor || cleaned.length) - removedBeforeCursor);

            }

            const clipboardText = event.clipboardData?.getData('text') || '';
            const cleaned = clipboardText.replace(/[^0-9()+\-]/g, '');
            const start = ui.phone.selectionStart ?? ui.phone.value.length;
            const end = ui.phone.selectionEnd ?? start;
            ui.phone.setRangeText(cleaned, start, end, 'end');
            sanitizePhoneValue();
            storage.setItem('phone', ui.phone.value);
        });
        ui.phone.addEventListener('drop', event => {
            event.preventDefault();
            const droppedText = event.dataTransfer?.getData('text') || '';
            const cleaned = droppedText.replace(/[^0-9()+\-]/g, '');
            const start = ui.phone.selectionStart ?? ui.phone.value.length;
            const end = ui.phone.selectionEnd ?? start;
            ui.phone.setRangeText(cleaned, start, end, 'end');
            sanitizePhoneValue();
            storage.setItem('phone', ui.phone.value);
        });
        ui.phone.addEventListener('beforeinput', event => {
            if (event.data && /[^0-9()+\-]/.test(event.data) && !['insertFromPaste', 'insertFromDrop', 'deleteContentBackward', 'deleteContentForward'].includes(event.inputType)) event.preventDefault();
        });
        async function createQrDataUrl(value) {
            if (typeof value !== 'string' || !value) return '';
            if (typeof QRCode === 'undefined') return '';
            const scratch = document.createElement('div');
            try {
                new QRCode(scratch, { text: value, width: 512, height: 512, colorDark: '#000000', colorLight: '#ffffff' });
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                const canvas = scratch.querySelector('canvas');
                if (canvas) return canvas.toDataURL('image/png');
                const image = scratch.querySelector('img');
                return image && /^data:image\/png;base64,/i.test(image.src) ? image.src : '';
            } catch (error) {
                return '';
            }
        }

        function showNotif(msg) {
            if (notifTimer) {
                clearTimeout(notifTimer);
                notifTimer = null;
            }
            ui.notif.classList.remove('show');
            void ui.notif.offsetWidth;
            ui.notif.textContent = msg;
            ui.notif.style.pointerEvents = 'auto';
            ui.notif.classList.add('show');
            notifTimer = setTimeout(() => {
                ui.notif.classList.remove('show');
                ui.notif.style.pointerEvents = 'none';
                notifTimer = null;
            }, 3000);
        }

        function openAd() {
            if (hasInfinitePoints()) return;
            clickTime = Date.now();
            window.open('https://www.profitablecpmratenetwork.com/ak0xgm6xu?key=96856a216ee758b70d6c8303e964e86b', '_blank');
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && clickTime > 0) {
                if (Date.now() - clickTime >= 4000) {
                    if (!hasInfinitePoints()) {
                        userPoints++;
                        storage.setItem('points', userPoints.toString());
                        updateUI();
                        showNotif(i18n[currentLang].succ_pts);
                    }

                    if (pendingAction) {
                        if (pendingAction === 'code' && (hasInfinitePoints() || userPoints >= 4)) {
                            let actionToRun = pendingAction;
                            pendingAction = null;
                            navigate('home');
                            handleAction(actionToRun);
                        } else if (pendingAction === 'qr' && (hasInfinitePoints() || userPoints >= 3)) {
                            let actionToRun = pendingAction;
                            pendingAction = null;
                            navigate('home');
                            handleAction(actionToRun);
                        }
                    }
                }
                clickTime = 0;
            }
        });

        async function handleAction(type) {
            const t = i18n[currentLang];
            sanitizePhoneValue();
            const number = ui.phone.value.replace(/[^0-9]/g, '');

            if (type === 'code') {
                if (number.length < 6) return showNotif(t.err_num);
                if (!hasInfinitePoints() && userPoints < 4) {
                    pendingAction = 'code';
                    navigate('points');
                    return showNotif(t.err_pts_code);
                }
                if (!hasInfinitePoints()) userPoints -= 4;
            } else if (type === 'qr') {
                if (!hasInfinitePoints() && userPoints < 3) {
                    pendingAction = 'qr';
                    navigate('points');
                    return showNotif(t.err_pts_qr);
                }
                if (!hasInfinitePoints()) userPoints -= 3;
            }

            pendingAction = null;
            if (!hasInfinitePoints()) storage.setItem('points', userPoints.toString());
            updateUI();

            ui.output.style.display = 'none';
            ui.loader.style.display = 'flex';
            ui.qr.innerHTML = '';
            ui.qr.style.display = 'none';
            ui.qrLink.style.display = 'none';
            ui.qrLink.href = '#';
            ui.code.style.display = 'none';
            ui.hint.style.display = 'none';

            let requestTimeout = null;
            try {
                const requestController = new AbortController();
                requestTimeout = setTimeout(() => requestController.abort(), 95000);
                const res = await fetch('/get-code', {
                    signal: requestController.signal,
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    cache: 'no-store',
                    body: JSON.stringify({ number: type === 'code' ? number : '', method: type })
                });
                clearTimeout(requestTimeout);
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.ok) throw new Error(data.error || `http_${res.status}`);

                if (type === 'code' && data.code) {
                    ui.code.textContent = data.code;
                    ui.code.style.display = 'block';
                    ui.hint.textContent = t.copy;
                    ui.hint.style.display = 'block';
                    ui.code.onclick = async () => {
                        try { await navigator.clipboard.writeText(data.code); showNotif(t.succ_copy); }
                        catch (error) { showNotif(data.code); }
                    };
                } else if (type === 'qr' && data.qr) {
                    let qrDataUrl = typeof data.qrDataUrl === 'string' ? data.qrDataUrl : '';
                    let qrUrl = typeof data.qrUrl === 'string' && /^https:\/\/\S+$/i.test(data.qrUrl) ? data.qrUrl : '';
                    if (!qrDataUrl) qrDataUrl = await createQrDataUrl(data.qr);
                    if (qrDataUrl && !qrUrl) {
                        try {
                            const uploadResponse = await fetch('/upload-qr', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                credentials: 'same-origin',
                                cache: 'no-store',
                                body: JSON.stringify({ imageData: qrDataUrl })
                            });
                            const uploadData = await uploadResponse.json().catch(() => ({}));
                            if (uploadResponse.ok && uploadData.ok && /^https:\/\/\S+$/i.test(String(uploadData.url || ''))) qrUrl = uploadData.url;
                        } catch (error) {}
                    }
                    if (qrDataUrl) {
                        const qrImage = document.createElement('img');
                        qrImage.alt = 'WhatsApp QR code';
                        qrImage.draggable = false;
                        qrImage.src = qrDataUrl;
                        ui.qr.appendChild(qrImage);
                    } else if (typeof QRCode !== 'undefined') {
                        new QRCode(ui.qr, { text: data.qr, width: 512, height: 512, colorDark: '#000000', colorLight: '#ffffff' });
                        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                        const canvas = ui.qr.querySelector('canvas');
                        const image = ui.qr.querySelector('img');
                        if (canvas) {
                            const qrImage = document.createElement('img');
                            qrImage.alt = 'WhatsApp QR code';
                            qrImage.draggable = false;
                            qrImage.src = canvas.toDataURL('image/png');
                            ui.qr.innerHTML = '';
                            ui.qr.appendChild(qrImage);
                            if (!qrUrl) {
                                try {
                                    const uploadResponse = await fetch('/upload-qr', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ imageData: qrImage.src }) });
                                    const uploadData = await uploadResponse.json().catch(() => ({}));
                                    if (uploadResponse.ok && uploadData.ok && /^https:\/\/\S+$/i.test(String(uploadData.url || ''))) qrUrl = uploadData.url;
                                } catch (error) {}
                            }
                        } else if (image) {
                            image.alt = 'WhatsApp QR code';
                            image.draggable = false;
                        }
                    }
                    if (!ui.qr.querySelector('img') && !ui.qr.querySelector('canvas')) throw new Error('qr_render_failed');
                    ui.qr.style.display = 'block';
                    ui.qrLink.href = qrUrl || qrDataUrl || ui.qr.querySelector('img')?.src || '#';
                    ui.qrLink.style.display = 'inline-flex';
                    ui.qrLink.setAttribute('aria-label', qrUrl ? 'Open the uploaded QR image in a new tab' : 'Open the QR image in a new tab');
                    ui.hint.textContent = t.qr_hint;
                    ui.hint.style.display = 'block';
                } else {
                    throw new Error('api_response_missing_result');
                }

                ui.loader.style.display = 'none';
                ui.output.style.display = 'block';
            } catch (error) {
                if (requestTimeout) clearTimeout(requestTimeout);
                ui.loader.style.display = 'none';
                ui.output.style.display = 'none';
                const failureReason = String(error?.message || '').toLowerCase();
                const failureMessage = /abort|timeout|deadline/.test(failureReason) ? t.err_timeout : /token_required|unauthori[sz]ed|forbidden|http_401|http_403|\b401\b|\b403\b/.test(failureReason) ? t.err_auth : /invalid_number/.test(failureReason) ? t.err_num : /qr_render_failed|qr_image|qrcode/.test(failureReason) ? t.err_qr : /http_5\d\d|connection closed|connection failure|pair_error|session_runtime|mongo_not_connected/.test(failureReason) ? t.err_server : t.err_conn;
                showNotif(failureMessage);
                console.error('Bot request failed:', error?.message || error);
            }
        }

        window.addEventListener('load', () => {
            try { history.scrollRestoration = 'manual'; } catch (error) {}
            try { if (navigator.storage && typeof navigator.storage.persist === 'function') navigator.storage.persist().catch(() => {}); } catch (error) {}
            let initialHash = window.location.hash.replace('#', '');
            const initialView = initialHash && initialHash !== 'pwen' ? initialHash : 'home';

            try {
                history.replaceState({ view: 'home' }, '', window.location.pathname + window.location.search);
            } catch (e) {}
            
            renderView('home');

            if (initialView !== 'home') {
                renderView(initialView);
                try {
                    history.pushState({ view: initialView }, '', window.location.pathname + window.location.search + '#' + initialView);
                } catch (e) {}
            }

            updateUI();
        });
    </script>
</body>
</html>
